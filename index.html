<style>
/* V0.3 - 清新廚房 / editorial kitchen */
:root{--bg:#f8f5ee;--paper:#fffdfa;--ink:#29372e;--mute:#73766d;--line:#eae4d8;--green:#457b57;--lightgreen:#e9f2e7;--orange:#d66b44;--lightorange:#fff1e6;--shadow:0 7px 22px rgba(66,58,39,.055)}

.box{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.box+.box{margin-top:13px}

.foods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.food{min-height:77px;border-radius:15px;border:1px solid #eee6db;background:#fcfaf6;color:#42453a;font-size:14px;font-weight:750;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;transition:background .15s,border-color .15s,transform .15s}.food:hover{background:#fff4e9;border-color:#e3b99d}.food:active{transform:scale(.975)}.food-emoji{font-size:23px;line-height:1.15}.food-label{font-size:14px;line-height:1.3}.food.on{background:#fff0e4;border:2px solid #db7854;color:#914b2f}.food.on:after{content:'✓';font-size:11px;display:grid;place-items:center;width:19px;height:19px;background:#d76c48;color:white;border-radius:50%;position:absolute;top:5px;right:5px}
.picked{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:14px 0 0}.picked .hint{font-size:12px;color:var(--mute)}.picktag{background:#fff0e6;border:1px solid #edc7b2;color:#a65532;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700}.clear{margin-left:auto;color:#8f8e84;background:transparent;border:0;font-size:12px;text-decoration:underline}.mini{font-size:12px;color:var(--mute)}
.pantry-control{margin-top:17px;padding-top:11px;border-top:1px dashed #e9e1d4}.pantry-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px;background:transparent;border:0;text-align:left;color:#505a4e;font-size:13px;font-weight:750}.pantry-toggle .pantry-state{color:var(--mute);font-size:12px;font-weight:500;margin-left:auto}.pantry-panel{margin-top:8px;border:1px solid var(--line);border-radius:16px;padding:14px;background:#f7f8f3}.pantry-panel[hidden]{display:none}.pantry-desc{font-size:12px;color:var(--mute);margin-bottom:10px}.pantry-foods{display:flex;flex-wrap:wrap;gap:7px}.pantry-food{border:1px solid #dcded4;background:#fff;border-radius:12px;padding:8px 12px;color:var(--ink);font-size:13px}.pantry-food.on{background:#eaf3e6;border-color:#a5c19c;color:#356b43;font-weight:750}.pantry-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}.pantry-quick{border:0;background:transparent;text-decoration:underline;color:var(--green);font-size:12px;padding:7px 0}.pantry-done{background:#334b3b;color:white;border:0;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:800}
.subtle{font-size:12px;color:var(--mute);margin-top:9px}.input-toggle{background:transparent;border:0;text-decoration:underline;color:#b2603d;font-size:12px;padding:0}.search-wrap{margin-top:10px;display:none;gap:7px}.search-wrap.visible{display:flex}.search-wrap input{min-width:0;flex:1;border:1px solid #e5ddd2;border-radius:12px;padding:10px;background:white;font-size:14px}.search-wrap button{border:0;border-radius:11px;padding:0 14px;background:#334b3b;color:white;font-weight:700}
/* 推薦列表：編輯式料理便條卡 */

.group{margin:17px 0 4px;display:flex;align-items:center;gap:7px}.group strong{font-size:15px}.count{color:#8c897e;font-size:12px}.group-note{font-size:12px;color:var(--mute);margin:4px 0 10px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.recipe{width:100%;min-height:114px;position:relative;display:flex;align-items:center;gap:12px;border:1px solid #e9e1d5;border-radius:19px;background:#fffefa;text-align:left;padding:14px 13px;box-shadow:0 3px 0 #e3dbc92d;transition:transform .15s,border-color .15s,box-shadow .15s}.recipe:hover{transform:translateY(-2px);border-color:#d7bbaa;box-shadow:0 9px 25px #75694e12}.recipe:active{transform:translateY(0)}
.thumb{width:60px;height:66px;display:grid;place-items:center;border-radius:13px;background:#f8ecd8;font-size:32px;flex-shrink:0}.recipe:nth-child(3n+2) .thumb{background:#e7f0dd}.recipe:nth-child(3n+3) .thumb{background:#f4e5df}.rtext{flex:1;min-width:0}.name{font-size:16px;font-weight:850;line-height:1.35;color:#273a2c}.meta{font-size:11px;color:#84877d;margin-top:4px;line-height:1.45}.badge{font-size:11px;border-radius:8px;padding:4px 7px;font-weight:800;white-space:nowrap}.ok{background:#e7f3e8;color:#37754b}.miss,.soon{background:#fff0df;color:#a45c31}.badge.check{background:#ecefeb;color:#67736a}.arrow{font-size:19px;color:#d0b8a6;margin-left:-7px}
.empty{text-align:center;padding:32px 12px;color:var(--mute);font-size:14px}.more{width:100%;padding:13px;background:transparent;border:1px solid #e1d5c6;border-radius:13px;color:#a35f42;margin-top:11px;font-weight:750}.footer{color:#999589;font-size:11px;line-height:1.9;text-align:center;margin-top:27px}
/* 食譜詳情 */
.dialog{max-width:530px;width:calc(100% - 28px);max-height:90vh;overflow:auto;border:0;border-radius:26px;padding:0;background:#fffefa;box-shadow:0 24px 80px #18231b5c;color:var(--ink)}.dialog::backdrop{background:#1d2b2299}.dialogin{padding:23px}.dialog-top{display:flex;align-items:flex-start;gap:13px}.dialog .thumb{background:#f6e7d4;height:63px}.close{border:0;background:#f9ebdf;color:#985639;border-radius:99px;width:35px;height:35px;flex-shrink:0;font-size:21px;line-height:1}.d-section{margin-top:18px;padding-top:15px;border-top:1px solid #ebe3d6}.d-section h3{font-size:16px;margin-bottom:9px}.d-section li{margin-bottom:7px;padding-left:3px}.d-section ul,.d-section ol{margin:0;padding-left:23px}.d-name{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:23px;line-height:1.25;margin-bottom:6px}.d-meta{font-size:13px;color:var(--mute)}.tip{background:#eef4e7;color:#43634a;border-radius:14px;padding:13px;margin-top:18px;font-size:13px}.missing{color:#ac643b}.inlineok{color:#3f8350}.needed{background:#f9f6ee;padding:11px 13px;border-radius:13px;margin-top:12px;font-size:13px}.needed .st{font-weight:800;margin-bottom:6px}.needed ul{padding-left:18px!important;margin:0!important}.needed li{margin-bottom:4px!important}.needed .unknown{color:#7a7e77}.needed .ready{color:#39804d}.needed .absent{color:#af6435}
/* 小螢幕固定即時回饋 */
.quickbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(680px,calc(100% - 24px));border:1px solid #e8ccb4;border-radius:17px;background:#fff8eeed;box-shadow:0 14px 35px #483c252c;z-index:10;padding:11px 11px 11px 15px;backdrop-filter:blur(12px)}.quickbar[hidden]{display:none}.quickbar-inner{display:flex;gap:10px;align-items:center;justify-content:space-between}.quickbar-inner .numbers{display:flex;flex-direction:column;min-width:0}.quickbar-inner strong{font-size:13px;line-height:1.45;color:#334637}.quickbar-inner span{font-size:11px;color:#857d70;line-height:1.5}.jump{border:0;border-radius:12px;flex-shrink:0;white-space:nowrap;min-height:43px;padding:9px 14px;background:#d56b46;color:#fff;font-size:13px;font-weight:850}
@media(max-width:850px){.cards{grid-template-columns:1fr}main{max-width:700px}.recipe{min-height:100px}}
@media(max-width:600px){main{padding:13px 13px 108px}.hero{padding:22px 19px;min-height:152px;border-radius:23px;margin-bottom:13px}.hero-copy{max-width:calc(100% - 75px)}.hero h1{font-size:28px;letter-spacing:-1px}.hero p{font-size:12px;margin-top:6px;line-height:1.5}.eyebrow{font-size:9px;letter-spacing:1.5px;margin-bottom:8px}.beta{padding:3px 7px;font-size:9px}.hero-art{width:110px;height:110px;right:-4px;top:53%}.hero-plate{height:102px;width:102px;border-width:7px}.hero-plate span{font-size:29px}.hero-plate span:nth-child(1){top:8px;left:6px}.hero-plate span:nth-child(2){right:3px;top:18px}.hero-plate span:nth-child(3){left:27px;bottom:0}.hero-leaf{font-size:14px}.box{padding:15px;border-radius:20px}.step{font-size:14px}.cats{gap:6px;padding-bottom:13px}.cat{padding:8px 12px;font-size:12px;min-height:41px}.foods{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.food{min-height:69px;border-radius:12px}.food-emoji{font-size:21px}.food-label{font-size:13px}.resultheader{margin-top:22px;flex-wrap:wrap;align-items:center}.resultheader h2{font-size:22px}.resultheader small{font-size:11px}.recipe{min-height:104px;gap:11px;padding:12px}.thumb{height:58px;width:57px;font-size:29px}.recipe .badge{align-self:flex-start;margin-top:5px;font-size:10px}.recipe{flex-wrap:wrap}.recipe .rtext{flex-basis:calc(100% - 95px)}.recipe .badge{margin-left:69px;margin-top:-7px}.recipe .arrow{position:absolute;right:14px;top:15px}.name{padding-right:15px}.footer{font-size:10px}}
@media(max-width:355px){.hero-copy{max-width:calc(100% - 58px)}.hero h1{font-size:25px}.hero-art{right:-25px;opacity:.9}.food{min-height:65px}.recipe .badge{margin-left:68px}}
@media(min-width:851px){.quickbar{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.recipe,.food{transition:none}}


/* V0.5 即時推薦分層，偏好只在符合料理較多時出現 */
.v05-preferences,.v05-types{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 14px}
.v05-chip,.v05-type{border:1px solid #e5dccf;background:#fffdf8;border-radius:100px;color:#657264;padding:8px 12px;font-size:12px;font-weight:700;min-height:39px}
.v05-chip.on,.v05-type.on{background:#334b3b;border-color:#334b3b;color:#fff}
.v05-featured{grid-template-columns:repeat(3,minmax(0,1fr))}
.v05-feature-item{min-width:0;border:1px solid #eadfd0;border-radius:19px;overflow:hidden;background:#fffefa}
.v05-feature-item .recipe{border:0;border-radius:0;box-shadow:none;height:100%;min-height:110px}
.v05-feature-item .badge{white-space:normal;text-align:center}
.v05-reason{font-size:11px;color:#7a806f;padding:0 14px 10px}
@media(max-width:800px){.v05-featured{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header class="hero"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-dot"></span> THE LITTLE KITCHEN</div><div class="reset-row"><h1>冰箱有什麼<span class="punct">？</span></h1><span class="beta">V0.5</span></div><p>點選食材，馬上找到今天能煮的菜。</p></div><div class="hero-art" aria-hidden="true"><span class="hero-leaf">✳</span><div class="hero-plate"><span>🍅</span><span>🥬</span><span>🥚</span></div></div></header>
<section class="box" aria-label="選擇食材">
<p class="step">看看冰箱裡有什麼 <span style="font-size:11px;font-weight:500;color:#8f9488">· 可複選</span></p>
<div class="cats" id="cats" role="group" aria-label="食材分類"></div>
<div class="foods" id="foods"></div>
<div class="picked" id="picked" aria-live="polite"></div>
<div class="pantry-control">
  <button type="button" class="pantry-toggle" id="pantryToggle" aria-controls="pantryPanel" aria-expanded="false"><span>🧂 家裡有哪些調味料？</span><span class="pantry-state" id="pantryStatus">尚未確認</span><span id="pantryChevron" aria-hidden="true">⌄</span></button>
  <div class="pantry-panel" id="pantryPanel" hidden>
    <p class="pantry-desc">只勾選家裡確定有的調味料。按「確認」後，沒勾選的才會顯示為缺少；水不需選。</p>
    <div class="pantry-foods" id="pantryFoods" role="group" aria-label="家裡有的調味料"></div>
    <div class="pantry-actions"><button class="pantry-quick" type="button" id="pantryQuick">快速勾選油、鹽、醬油</button><button class="pantry-done" type="button" id="pantryDone">確認調味料</button></div>
  </div>
</div>
<p class="subtle">找不到食材？ <button type="button" class="input-toggle" id="toggleInput">從全部食材搜尋</button></p>
<div class="search-wrap" id="searchWrap"><input id="search" placeholder="例如：香菇、蛤蜊、馬鈴薯" autocomplete="off" list="foodSuggestions" aria-label="搜尋食材"><datalist id="foodSuggestions"></datalist><button id="addFood" type="button">選取</button></div>
</section>
<div class="resultheader"><h2>今天可以煮什麼？</h2><small id="summary" aria-live="polite"></small></div>
<section id="results"></section>
<p class="footer">免登入・點選即時更新・食材與調味料只儲存在這台裝置<br>食譜為新手參考用；請確認食材份量、保存狀況與熟度。<br>不會任意替換傳統料理的核心材料。</p>
</main>
<aside class="quickbar" id="quickbar" hidden aria-label="即時推薦結果"><div class="quickbar-inner"><div class="numbers"><strong id="quickSummary"></strong><span id="quickDetail"></span></div><button type="button" class="jump" id="jumpResults">看料理 ↓</button></div></aside>
<dialog class="dialog" id="recipeDialog" aria-label="食譜詳情"><div class="dialogin" id="dialogContent"></div></dialog>
<script>
// 手工整理的示範食譜；不使用第三方食譜圖文，亦不需網路或 AI 服務。
const GROUPS = [
  {name:'常用',foods:['雞蛋','番茄','豆腐','洋蔥','高麗菜','豬肉片','雞肉','青蔥','蒜頭','白飯','馬鈴薯','紅蘿蔔']},
  {name:'蔬菜',foods:['番茄','洋蔥','高麗菜','青江菜','空心菜','青椒','紅蘿蔔','馬鈴薯','絲瓜','香菇','青蔥','蒜頭','薑']},
  {name:'肉類',foods:['豬肉片','雞肉','豬絞肉']},
  {name:'蛋豆',foods:['雞蛋','豆腐','豆干']},
  {name:'海鮮',foods:['蝦仁','蛤蜊','海帶芽']},
  {name:'主食',foods:['白飯','麵條']},
  {name:'特殊調味',foods:['味噌','咖哩塊','豆瓣醬','九層塔','麻油']}
];
// need：料理的必要主要食材。沒有列入 need 的基本調味料，會在詳情提醒確認。
const RECIPES = [
['番茄炒蛋','🍅',12,['番茄','雞蛋'],'食用油、鹽、少量糖（可省略）',['番茄切塊，雞蛋打散。','熱鍋放油，先將蛋炒至大致凝固後盛起。','番茄下鍋炒軟，可加少量水，再放回雞蛋拌勻調味。'],'番茄酸度不同，可依個人口味調整糖量。'],
['蔥花煎蛋','🥚',10,['雞蛋','青蔥'],'食用油、鹽',['青蔥切碎，雞蛋打散，與鹽混合。','平底鍋放油，倒入蛋液。','中小火煎至底部凝固，翻面煎熟。'],'蛋液應完全凝固再食用。'],
['洋蔥炒蛋','🧅',13,['洋蔥','雞蛋'],'食用油、鹽',['洋蔥切絲，雞蛋打散。','先將洋蔥炒軟，再倒入蛋液。','輕輕翻炒至雞蛋凝固，調味後起鍋。'],'洋蔥想要更甜，可以先多炒一會兒。'],

function makeCard(o){

const CATEGORY_GROUPS_V05={"main":["洋蔥炒豬肉","高麗菜炒豬肉","蒜香雞肉","洋蔥炒雞肉","雞肉馬鈴薯燉煮","馬鈴薯燉豬肉","青椒炒豬肉","豬肉炒蛋","蒜香蝦仁","青椒炒雞肉","咖哩雞肉","家常麻婆豆腐","洋蔥炒蝦仁","肉末燴豆腐","洋蔥肉末炒蛋"],"soup":["番茄蛋花湯","番茄豆腐湯","海帶芽豆腐湯","蛤蜊清湯","香菇雞湯","味噌豆腐湯","高麗菜蛋花湯","青江菜豆腐湯","薑絲雞湯"],"staple":["雞肉蛋炒飯","蛋炒飯","高麗菜蛋炒飯","蝦仁蛋炒飯","蒜香炒麵","番茄蛋炒飯","高麗菜雞肉炒飯","番茄雞肉燴飯"],"side":["番茄炒蛋","蔥花煎蛋","洋蔥炒蛋","家常蒸蛋","豆腐蒸蛋","清炒高麗菜","蒜炒青江菜","蒜炒空心菜","番茄燴豆腐","香煎豆腐","蝦仁炒蛋","蛤蜊絲瓜","馬鈴薯煎餅","紅蘿蔔煎蛋","香菇炒蛋","青椒炒豆干","水煮蛋","荷包蛋","蒜香炒高麗菜","香菇燴豆腐","蒜炒香菇","絲瓜炒蛋","青椒炒蛋","九層塔煎蛋","蒜香炒豆干"]};
const CATEGORY_LABELS_V05={main:'主菜',side:'家常菜',soup:'湯品',staple:'主食'};
const HARD_V05=new Set(["雞肉蛋炒飯","蝦仁蛋炒飯","家常麻婆豆腐","洋蔥肉末炒蛋","高麗菜雞肉炒飯","番茄雞肉燴飯"]);
const MEDIUM_V05=new Set(["家常蒸蛋","豆腐蒸蛋","洋蔥炒豬肉","高麗菜炒豬肉","蒜香雞肉","洋蔥炒雞肉","雞肉馬鈴薯燉煮","馬鈴薯燉豬肉","青椒炒豬肉","豬肉炒蛋","蛋炒飯","高麗菜蛋炒飯","香煎豆腐","蝦仁炒蛋","蒜香蝦仁","蛤蜊清湯","蛤蜊絲瓜","馬鈴薯煎餅","香菇雞湯","青椒炒雞肉","咖哩雞肉","蒜香炒麵","荷包蛋","絲瓜炒蛋","番茄蛋炒飯","洋蔥炒蝦仁","肉末燴豆腐","薑絲雞湯"]);
const CATEGORY_BY_NAME_V05=Object.fromEntries(Object.entries(CATEGORY_GROUPS_V05).flatMap(([cat,names])=>names.map(name=>[name,cat])));
let recommendationModeV05='smart',categoryFilterV05='all';
function difficultyV05(name){return HARD_V05.has(name)?3:MEDIUM_V05.has(name)?2:1}
function scoreRecipeV05(o){
 const r=RECIPES[o.i],time=r[2],difficulty=difficultyV05(r[0]);
 const pantryPts=o.cond.length===0?40:(pantryConfirmed?Math.max(0,40-16*o.cond.length):Math.max(0,30-9*o.cond.length));
 const easePts=difficulty===1?25:difficulty===2?18:9;
 const timePts=time<=15?20:time<=20?17:time<=30?12:7;
 const usePts=Math.min(15,5*o.matched);
 let score=pantryPts+easePts+timePts+usePts;
 if(recommendationModeV05==='quick')score+=Math.max(0,26-time)*0.45;
 if(recommendationModeV05==='easy'&&difficulty===1)score+=9;
 if(recommendationModeV05==='use')score+=o.matched*7;
 return score;
}
function rankRecipesV05(candidates){
 return candidates.filter(o=>{
   const r=RECIPES[o.i],d=difficultyV05(r[0]);
   return recommendationModeV05==='quick'?r[2]<=20:recommendationModeV05==='easy'?d<=2:true;
 }).map(o=>({...o,scoreV05:scoreRecipeV05(o)}))
 .sort((a,b)=>b.pantryRank-a.pantryRank||b.scoreV05-a.scoreV05||RECIPES[a.i][2]-RECIPES[b.i][2]||a.i-b.i);
}
function featuredRecipesV05(ranked){
 // 有至少三道必要調味已齊的選擇時，不讓未確認調味的菜擠進前三道。
 const verified=ranked.filter(o=>o.cond.length===0);
 const pool=(verified.length>=3?verified:ranked).slice();
 const featured=[];
 while(featured.length<3&&pool.length){
  let bestIndex=0,bestScore=-Infinity;
  pool.forEach((o,index)=>{
   const category=CATEGORY_BY_NAME_V05[RECIPES[o.i][0]];
   const repeatedCategory=featured.some(x=>CATEGORY_BY_NAME_V05[RECIPES[x.i][0]]===category);
   const overlap=featured.reduce((sum,x)=>Math.max(sum,RECIPES[o.i][3].filter(f=>RECIPES[x.i][3].includes(f)).length),0);
   const adjusted=o.scoreV05-(repeatedCategory?18:0)-Math.min(overlap,2)*4;
   if(adjusted>bestScore){bestScore=adjusted;bestIndex=index}
  });
  featured.push(pool.splice(bestIndex,1)[0]);
 }
 return featured;
}
function labelRecipeV05(o){
 const r=RECIPES[o.i];
 return (CATEGORY_LABELS_V05[CATEGORY_BY_NAME_V05[r[0]]]||'料理')+' · '+(difficultyV05(r[0])===1?'容易上手':difficultyV05(r[0])===2?'家常難度':'稍有挑戰');
}
